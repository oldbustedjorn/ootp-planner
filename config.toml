[paths]
online_data_dir = "E:/Out of the Park Developments/OOTP Baseball 27/data/online_data"
hitters_csv = "E:/Out of the Park Developments/OOTP Baseball 27/data/online_data/collection_-_manage_cards_collection_-_manage_cards_gpt_batters.csv"
pitchers_csv = "E:/Out of the Park Developments/OOTP Baseball 27/data/online_data/collection_-_manage_cards_collection_-_manage_cards_gpt_pitchers.csv"
store_csv = "E:/Out of the Park Developments/OOTP Baseball 27/data/online_data/pt_card_list.csv"
output_dir = "outputs"

[defaults]
profile = "both"

[hitters]
use_nonlinear_transforms = true

defense_scale = 0.70
vs_rhp_weight = 0.70
vs_lhp_weight = 0.30
min_pos_rating = 1.0

# batting weights
contact = 0.00
power = 1.15
eye = 1.00
gap_power = 0.45
babip = 1.05
avoid_k = 1.15

# small offensive baserunning bonus
off_speed = 0.06
off_baserunning = 0.10
off_stealing_ability = 0.03
off_stealing_aggressiveness = 0.01

# pinch-running weights
pr_speed = 1.00
pr_baserunning = 0.80
pr_stealing_ability = 0.70
pr_stealing_aggressiveness = 0.40

# defensive component weights
fld_pos = 1.00
c_framing = 1.20
c_blocking = 0.90
c_arm = 0.70
if_range = 1.10
if_error = 0.60
if_arm = 0.70
turn_dp = 0.60
of_range = 1.10
of_error = 0.55
of_arm = 0.65

# position blends: offense, defense
[position_blends]
C = [0.90, 1.10]
SS = [0.92, 1.05]
CF = [0.93, 1.03]
2B = [0.94, 1.00]
3B = [0.95, 0.98]
RF = [0.96, 0.95]
LF = [0.97, 0.92]
1B = [0.98, 0.80]

[pitchers]
vs_rhb_weight = 0.70
vs_lhb_weight = 0.30

# starter gating / role settings
stamina = 0.00
pitch_count = 8.0
pitch_threshold = 60.0
starter_min_stamina = 60
starter_min_good_pitches = 3
starter_stamina_gate_penalty = 1000000
starter_pitch_gate_penalty = 250000

use_nonlinear_transforms = true

# starter weights
sp_stuff = 1.05
sp_pbabip = 1.00
sp_hr_rate = 1.45
sp_control = 1.10
sp_movement = 0.00

# reliever weights
rp_stuff = 1.90
rp_pbabip = 0.70
rp_hr_rate = 1.15
rp_control = 0.75
rp_movement = 0.00

[roster]
# Base roster shape used when no explicit base profile is requested.
default_base_profile = "standard_pt"

# Generic tournament/settings defaults.
# Empty strings, zeros, empty lists, and empty tables usually mean "not restricted".
# Exception: variant_limit = 0 explicitly means no variants. Leave it blank for no limit.
# These are meant to be overridden later by CLI/GUI inputs or a small test harness.
[roster_build_defaults]
tier_min = ""
tier_max = ""
card_value_min = 0
card_value_max = 0
variant_limit = ""
live_mode = "all" # all, live, non_live
# Card type filters use the normalized CType codes from owned-card exports:
# 2026Live, AS, FL, HaH, Leg, NeL, RS, Snap, UnH, VET
allowed_card_types = []
excluded_card_types = []
card_year_min = 0
card_year_max = 0
simulation_year = 0
ballpark = ""
ballpark_year = 0
point_cap_total = 0

[roster_build_defaults.tier_slots]
# Optional tier slot targets. These are reported and greedily repaired when configured.
# Full tier names or abbreviations are accepted in tournament presets:
# perfect/P = 2
# diamond/D = 3
# gold/G = 4
# silver/S = 5
# bronze/B = 6
# iron/I = 6

[roster_build_defaults.custom_park_factors]
# Optional direct park-factor overrides for tournament text when a named park
# is not present in ootp_opt/data/park_factors.csv.
# Supported keys include:
# ba_lh, ba_rh, hr_lh, hr_rh, doubles_overall, triples_overall

# Standard unrestricted Perfect Team roster shape.
[roster_base_profiles.standard_pt]
mode = "standard_pt"
hitter_count = 13
pitcher_count = 13
dh_enabled = true
platoons_allowed = false
lineup_fill_order = ["C", "SS", "CF", "2B", "3B", "LF", "RF", "1B", "DH"]
rotation_size = 5
primary_rp_count = 6
specialist_lhp_count = 1
long_man_count = 1

# v1 bench-building approach:
# 1 backup C, 1 backup IF, 1 backup OF, 1 utility / gap-filler
bench_roles = ["C", "IF", "OF", "UTIL"]

[roster_base_profiles.standard_pt.min_defense_by_position]
C = 80
1B = 40
2B = 60
3B = 60
SS = 85
LF = 65
CF = 85
RF = 65

[roster_base_profiles.standard_pt.bench_role_requirements.C]
required_positions = ["C"]

[roster_base_profiles.standard_pt.bench_role_requirements.IF]
required_positions = ["SS", "2B"]
preferred_positions = ["SS", "2B", "3B", "1B"]

[roster_base_profiles.standard_pt.bench_role_requirements.OF]
required_positions = ["CF", "LF", "RF"]
preferred_positions = ["CF", "LF", "RF"]

[roster_base_profiles.standard_pt.bench_role_requirements.UTIL]
required_positions_any = ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"]
preferred_positions = ["C", "SS", "CF", "2B", "3B", "LF", "RF", "1B"]

# Playoff / open-tournament style roster shape.
# Uses a 4-man rotation and an extra bench slot.
[roster_base_profiles.playoff_pt]
mode = "playoff_pt"
hitter_count = 14
pitcher_count = 12
dh_enabled = true
platoons_allowed = false
lineup_fill_order = ["C", "SS", "CF", "2B", "3B", "LF", "RF", "1B", "DH"]
rotation_size = 4
primary_rp_count = 6
specialist_lhp_count = 1
long_man_count = 1
bench_roles = ["C", "IF", "OF", "UTIL", "UTIL"]

[roster_base_profiles.playoff_pt.min_defense_by_position]
C = 80
1B = 40
2B = 60
3B = 60
SS = 85
LF = 65
CF = 85
RF = 65

[roster_base_profiles.playoff_pt.bench_role_requirements.C]
required_positions = ["C"]

[roster_base_profiles.playoff_pt.bench_role_requirements.IF]
required_positions = ["SS", "2B"]
preferred_positions = ["SS", "2B", "3B", "1B"]

[roster_base_profiles.playoff_pt.bench_role_requirements.OF]
required_positions = ["CF", "LF", "RF"]
preferred_positions = ["CF", "LF", "RF"]

[roster_base_profiles.playoff_pt.bench_role_requirements.UTIL]
required_positions_any = ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF"]
preferred_positions = ["C", "SS", "CF", "2B", "3B", "LF", "RF", "1B"]

# -----------------------------
# Tournament presets
# -----------------------------
# These are named wrappers around a base roster shape plus eligibility filters.
# Simulation year and ballpark can be set independently. Tournament text may use
# one simulation year with park factors from a different historical park year.

[tournament_presets.goldmax_nonlive_1580cap_variantmax10_DH]
base_profile = "playoff_pt"
tier_max = "gold"
live_mode = "non_live"
point_cap_total = 1580
variant_limit = 10
dh_enabled = true

[tournament_presets.high_iron_floor_gold_ceiling]
base_profile = "playoff_pt"
tier_max = "gold"
card_value_min = 50
point_cap_total = 1767
dh_enabled = true

[tournament_presets.q_lowg_unh_snap_rs_1999_dh]
base_profile = "playoff_pt"
card_value_max = 84
allowed_card_types = ["UnH", "Snap", "RS"]
simulation_year = 1999
dh_enabled = true

[tournament_presets.my_slot_test]
base_profile = "playoff_pt"

[tournament_presets.my_slot_test.tier_slots]
P = 2
D = 1
G = 1
S = 12
B = 6
I = 5

[tournament_presets.sporers_sandlot]
base_profile = "playoff_pt"
tier_min = "bronze"
tier_max = "gold"
point_cap_total = 1858
dh_enabled = true

[tournament_presets.cwhit_cap_challenge]
base_profile = "playoff_pt"
card_value_min = 50
card_value_max = 84
card_year_min = 1930
card_year_max = 1989
point_cap_total = 1699
dh_enabled = false

[tournament_presets.daily_diamond_heart_1958_no_dh]
base_profile = "playoff_pt"
tier_max = "diamond"
card_year_min = 1930
card_year_max = 1989
simulation_year = 1958
ballpark = "Fenway Park"
ballpark_year = 1955
